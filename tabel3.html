<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Table HTML</title>
</head>
<body>
    
    <table border="1" cellpadding="10" cellspacing="10">
         <tr>
            <th rowspan="2" bgcolor="cyan">Bulan</th>
            <th colspan="2" bgcolor="yellow">Penjualan</th>
          
        </tr>

        <tr>
          <th>Produk A</th>
          <th>Produk B</th>

        <tr>
            <td bgcolor="purple">Januari</td>
            <td>100</td>
            <td>175</td>
        </tr>

        <tr>
            <td bgcolor="green">Februari</td>
            <td>200</td>
            <td>189</td>
        </tr>

    </table>
</body>
</html>
